name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DAGGER_VERSION: '0.21.8'
  RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
  TRUST_DOMAIN: release

jobs:
  release:
    name: Publish release
    if: github.repository == 'araihu/muamba'
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') }}
    # GoReleaser creates the GitHub release. Cosign inside its pinned image uses
    # GitHub OIDC for keyless signing.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Dagger on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify exact Dagger version
        id: verify-dagger
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::expected Dagger $expected, found $actual"
            exit 1
          fi
          echo "exact=true" >> "$GITHUB_OUTPUT"

      - name: Run release tests
        shell: bash
        run: >-
          dagger call release-test
          --source=.
          --trust-domain="${TRUST_DOMAIN}"
          --run-nonce="${RUN_NONCE}"

      - name: Validate, sign, and publish release
        shell: bash
        run: >-
          dagger call publish-release
          --source=.
          --github-token=env://GITHUB_TOKEN
          --oidc-token=env://ACTIONS_ID_TOKEN_REQUEST_TOKEN
          --oidc-url=env://ACTIONS_ID_TOKEN_REQUEST_URL
          --tag="${GITHUB_REF_NAME}"
          --commit="${GITHUB_SHA}"
          --repository=https://github.com/araihu/muamba.git
          --trust-domain="${TRUST_DOMAIN}"
          --run-nonce="${RUN_NONCE}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
