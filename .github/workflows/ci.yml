name: Required CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-image://registry.dagger.io/engine:v0.21.11@sha256:6b557cc8b5fdfee0e2e8c82d451ac922097a1255482143e1b96c0be3ff2a303c
  DAGGER_VERSION: '0.21.11'
  MIN_COVERAGE: '70.0'
  RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
  TRUST_DOMAIN: >-
    ${{
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
      github.event_name == 'pull_request' && 'internal' ||
      'main'
    }}

jobs:
  required:
    name: Required CI
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-24.04'
      }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify exact Dagger version
        id: verify-dagger
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::expected Dagger $expected, found $actual"
            exit 1
          fi
          echo "exact=true" >> "$GITHUB_OUTPUT"

      - name: Verify generated SDK and dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          dagger develop
          git diff --exit-code -- dagger.json .dagger

      - name: Run required Dagger checks
        shell: bash
        run: >-
          dagger call check
          --source=.
          --minimum-coverage="${MIN_COVERAGE}"
          --trust-domain="${TRUST_DOMAIN}"
          --run-nonce="${RUN_NONCE}"

      - name: Export coverage artifact
        if: ${{ always() && steps.verify-dagger.outputs.exact == 'true' }}
        shell: bash
        run: >-
          dagger call coverage-report
          --source=.
          --trust-domain="${TRUST_DOMAIN}"
          --run-nonce="${RUN_NONCE}"
          export --path=.coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .coverage/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
