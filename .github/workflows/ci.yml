name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      - name: Run tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Verify vendored example offline
        run: go run ./cmd/muamba verify --strict -f examples/web-assets/muamba.yaml
      - name: Check generated example
        run: >-
          go run ./cmd/muamba generate-go --strict --check
          -f examples/web-assets/muamba.yaml
          --dir assets
          --output muamba_gen.go
