name: Required CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  GORELEASER_VERSION: 'v2.17.1'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  MIN_COVERAGE: '70.0'

jobs:
  required:
    name: Required CI
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps"]') ||
        'ubuntu-24.04'
      }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Check module metadata drift
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum drift; run 'go mod tidy' and commit the result"; exit 1; }

      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [[ -n "$out" ]]; then
            echo "::error::gofmt drift in:"
            echo "$out"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/muamba" ./cmd/muamba

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
        env:
          GOCACHE: ${{ runner.temp }}/goreleaser-go-build

      - name: Verify release snapshot
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name 'muamba_*_linux_amd64.tar.gz' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "::error::Linux amd64 release archive missing"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/muamba-release-smoke"
          tar -xzf "$archive" -C "$RUNNER_TEMP/muamba-release-smoke"
          version_output="$("$RUNNER_TEMP/muamba-release-smoke/muamba" version)"
          grep -E 'muamba v.+-SNAPSHOT-.+linux/amd64' <<<"$version_output"
          grep -F "commit $(git rev-parse HEAD)" <<<"$version_output"
          (cd dist && sha256sum --check checksums.txt)

      - name: Test coverage gate
        run: scripts/check-coverage_test.sh

      - name: Run tests with coverage
        run: scripts/check-coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: .coverage/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Verify vendored example offline
        run: go run ./cmd/muamba verify --strict -f examples/web-assets/muamba.yaml

      - name: Check generated example
        run: >-
          go run ./cmd/muamba generate-go --strict --check
          -f examples/web-assets/muamba.yaml
          --dir assets
          --output muamba_gen.go
